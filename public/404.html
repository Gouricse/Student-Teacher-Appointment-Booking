<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Academic Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --primary-color: #4361ee;
      --secondary-color: #3f37c9;
      --accent-color: #4895ef;
      --error-color: #f72585;
      --light-color: #f8f9fa;
      --dark-color: #212529;
      --gradient: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--light-color);
      color: var(--dark-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      background: linear-gradient(-45deg, #f8f9fa, #e9ecef, #dee2e6, #ced4da);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    #message {
      background: white;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 3rem;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.8s ease;
    }

    #message::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: var(--gradient);
    }

    .error-icon {
      font-size: 5rem;
      color: var(--error-color);
      margin-bottom: 1.5rem;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-30px);
      }
      60% {
        transform: translateY(-15px);
      }
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: var(--dark-color);
      font-weight: 700;
    }

    h2 {
      font-size: 6rem;
      color: var(--error-color);
      margin-bottom: 1.5rem;
      font-weight: 800;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.1);
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      color: #555;
    }

    .home-btn {
      display: inline-block;
      background: var(--gradient);
      color: white;
      text-decoration: none;
      padding: 1rem 2rem;
      border-radius: 50px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 1rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
    }

    .home-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(67, 97, 238, 0.4);
    }

    .home-btn i {
      margin-right: 8px;
    }

    code {
      background: #f5f5f5;
      padding: 2px 5px;
      border-radius: 3px;
      font-family: monospace;
      color: var(--error-color);
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }
      
      h2 {
        font-size: 4rem;
      }
      
      #message {
        padding: 2rem 1.5rem;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Floating animation for background elements */
    .floating {
      position: absolute;
      opacity: 0.1;
      z-index: -1;
    }

    .floating-1 {
      top: 20%;
      left: 10%;
      font-size: 10rem;
      color: var(--primary-color);
      animation: float 6s ease-in-out infinite;
    }

    .floating-2 {
      bottom: 15%;
      right: 10%;
      font-size: 8rem;
      color: var(--secondary-color);
      animation: float 8s ease-in-out infinite;
    }

    .floating-3 {
      top: 60%;
      left: 25%;
      font-size: 6rem;
      color: var(--accent-color);
      animation: float 7s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-20px);
      }
    }
  </style>
</head>
<body>
  <div id="message">
    <div class="error-icon">
      <i class="fas fa-exclamation-triangle"></i>
    </div>
    <h2>404</h2>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <p>Please check the URL for mistakes or try searching for what you're looking for.</p>
    
    <a href="/" class="home-btn">
      <i class="fas fa-home"></i> Return Home
    </a>

    <div class="floating floating-1">
      <i class="fas fa-file"></i>
    </div>
    <div class="floating floating-2">
      <i class="fas fa-question-circle"></i>
    </div>
    <div class="floating floating-3">
      <i class="fas fa-search"></i>
    </div>
  </div>
</body>
</html>
