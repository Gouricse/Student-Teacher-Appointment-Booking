<!DOCTYPE html>
<html>
<head>
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="container">
    <div class="dashboard-header">
      <h1><i class="fas fa-user-graduate"></i> Student Dashboard</h1>
      <button id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>

    <section>
      <h2><i class="fas fa-calendar-plus"></i> Book Appointment</h2>
      <form id="bookForm">
        <div class="form-group">
          <select id="teacherSelect" required>
            <option value="">Select Teacher</option>
          </select>
        </div>
        <div class="form-group">
          <input type="datetime-local" id="appointmentTime" required>
        </div>
        <div class="form-group">
          <textarea id="message" placeholder="Enter your message" rows="4" required></textarea>
        </div>
        <button type="submit"><i class="fas fa-bookmark"></i> Book Appointment</button>
      </form>
    </section>

    <section>
      <h2><i class="fas fa-calendar-check"></i> Your Appointments</h2>
      <ul id="appointmentsList"></ul>
    </section>

    <section>
      <h2><i class="fas fa-comments"></i> Send Message to Teacher</h2>
      <form id="messageForm">
        <div class="form-group">
          <select id="messageTeacherSelect" required>
            <option value="">Select Teacher</option>
          </select>
        </div>
        <div class="form-group">
          <textarea id="messageText" placeholder="Enter your message" rows="4" required></textarea>
        </div>
        <button type="submit"><i class="fas fa-paper-plane"></i> Send Message</button>
      </form>
    </section>

    <section>
      <h2><i class="fas fa-inbox"></i> Your Sent Messages</h2>
      <ul id="messageList"></ul>
    </section>
  </div>

  <script type="module" src="js/student.js"></script>
</body>
</html>
