<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Academic Portal</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* Additional specific styles for register page */
    .register-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }
    
    #registerForm {
      max-width: 500px;
      width: 100%;
      padding: 3rem;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      animation: slideUp 0.8s ease;
      position: relative;
      overflow: hidden;
    }
    
    #registerForm::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(135deg, #4361ee, #3f37c9);
    }
    
    #registerForm h2 {
      text-align: center;
      margin-bottom: 2rem;
      color: #4361ee;
      font-size: 2rem;
    }
    
    .form-group {
      position: relative;
      margin-bottom: 1.5rem;
    }
    
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 1rem 1rem 1rem 3rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #4895ef;
      box-shadow: 0 0 0 3px rgba(72, 149, 239, 0.2);
    }
    
    .input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #4361ee;
    }
    
    .login-link {
      text-align: center;
      margin-top: 2rem;
      color: #666;
    }
    
    .login-link a {
      color: #4361ee;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    
    .login-link a:hover {
      color: #3f37c9;
      text-decoration: underline;
    }
    
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .logo i {
      font-size: 3rem;
      color: #4361ee;
      margin-bottom: 1rem;
    }
    
    .logo h1 {
      color: #4361ee;
      margin: 0;
      font-size: 1.8rem;
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Password strength indicator */
    .password-strength {
      height: 5px;
      background: #eee;
      border-radius: 5px;
      margin-top: 0.5rem;
      overflow: hidden;
    }
    
    .strength-meter {
      height: 100%;
      width: 0;
      transition: width 0.3s ease;
    }
    
    /* Responsive adjustments */
    @media (max-width: 600px) {
      #registerForm {
        padding: 2rem 1.5rem;
      }
      
      .logo i {
        font-size: 2.5rem;
      }
      
      .logo h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="register-container">
    <form id="registerForm">
      <div class="logo">
        <i class="fas fa-graduation-cap"></i>
        <h1>Create Your Account</h1>
      </div>
      
      <div class="form-group">
        <input type="text" id="name" placeholder="Full Name" required>
        <i class="fas fa-user input-icon"></i>
      </div>
      
      <div class="form-group">
        <input type="email" name="email" placeholder="Email Address" required>
        <i class="fas fa-envelope input-icon"></i>
      </div>
      
      <div class="form-group">
        <input type="password" name="password" placeholder="Create Password" required id="passwordField">
        <i class="fas fa-lock input-icon"></i>
        <div class="password-strength">
          <div class="strength-meter" id="passwordStrength"></div>
        </div>
      </div>
      
      <div class="form-group">
        <select name="role" required>
          <option value="">Select Your Role</option>
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
        </select>
        <i class="fas fa-user-tag input-icon"></i>
      </div>
      
      <button type="submit" class="register-btn">
        <i class="fas fa-user-plus"></i> Register Now
      </button>
      
      <div class="login-link">
        Already have an account? <a href="index.html"><i class="fas fa-sign-in-alt"></i> Login Here</a>
      </div>
    </form>
  </div>

  <script>
    // Password strength indicator
    document.getElementById('passwordField').addEventListener('input', function() {
      const password = this.value;
      const strengthMeter = document.getElementById('passwordStrength');
      let strength = 0;
      
      if (password.length > 0) strength += 20;
      if (password.length >= 8) strength += 30;
      if (/[A-Z]/.test(password)) strength += 15;
      if (/[0-9]/.test(password)) strength += 15;
      if (/[^A-Za-z0-9]/.test(password)) strength += 20;
      
      strengthMeter.style.width = strength + '%';
      
      if (strength < 40) {
        strengthMeter.style.backgroundColor = '#ff4757'; // Red
      } else if (strength < 70) {
        strengthMeter.style.backgroundColor = '#ffa502'; // Orange
      } else {
        strengthMeter.style.backgroundColor = '#2ed573'; // Green
      }
    });
  </script>
  
  <script type="module" src="js/auth.js"></script>
</body>
</html>
